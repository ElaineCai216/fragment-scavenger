<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="碎片拾荒者：不按时间，按感觉。收集文字、照片、语音与链接，像幻灯片一样回忆它们。" />
  <title>碎片拾荒者 · Fragment Scavenger</title>
</head>
<body>
  <!-- 动态背景层 -->
  <div class="bg" aria-hidden="true">
    <div class="bg-blob b1"></div>
    <div class="bg-blob b2"></div>
    <div class="bg-light"></div>
    <div class="bg-shaft"></div>
    <div class="bg-vignette"></div>
    <div class="bg-grain"></div>
    <div class="bg-dust"></div>
  </div>

  <header class="topbar">
    <div class="brand">
      <h1 class="brand-title">碎片拾荒者</h1>
      <p class="brand-sub">不按时间，按感觉</p>
    </div>
    <div class="topbar-actions">
      <div class="search-box">
        <input id="search-input" type="search" placeholder="搜氛围或内容…" autocomplete="off" />
        <button id="btn-play-search" class="mini-btn" title="播放搜索结果" hidden>播放</button>
      </div>
      <button id="btn-scavenge" class="stamp-btn" title="随机拾一片">拾一片</button>
      <button id="btn-add" class="primary-btn">＋ 丢一片</button>
      <button id="btn-settings" class="round-btn" title="设置">⚙</button>
    </div>
  </header>

  <main id="wall" class="wall" aria-live="polite"></main>

  <footer class="foot">
    <span id="foot-count">还没有碎片</span>
    <span class="foot-dot">·</span>
    <span>数据只存在这台设备</span>
  </footer>

  <!-- 幻灯片 -->
  <div id="slide-overlay" class="overlay hidden" role="dialog" aria-label="幻灯片播放">
    <div class="slide-top">
      <div class="slide-tag-wrap"><span id="slide-mood" class="stamp-tag"></span></div>
      <div class="slide-count" id="slide-count"></div>
      <button id="btn-slide-edit" class="mini-btn" title="编辑这片碎片">编辑</button>
      <button id="btn-slide-close" class="round-btn" title="关闭">✕</button>
    </div>
    <div class="slide-body" id="slide-body"></div>
    <div class="slide-progress"><div id="slide-progress-bar" class="slide-progress-bar"></div></div>
    <div class="slide-controls">
      <button id="btn-prev" class="ctrl-btn" title="上一片">‹</button>
      <button id="btn-playpause" class="ctrl-btn ctrl-main" title="暂停/继续">⏸</button>
      <button id="btn-next" class="ctrl-btn" title="下一片">›</button>
    </div>
  </div>

  <!-- 添加碎片 -->
  <div id="add-overlay" class="overlay hidden" role="dialog" aria-label="丢一片碎片">
    <div class="panel add-panel">
      <div class="panel-head">
        <h2>丢一片碎片</h2>
        <button class="round-btn js-close" title="关闭">✕</button>
      </div>
      <div class="tabs" id="add-tabs">
        <button class="tab active" data-type="text">文字</button>
        <button class="tab" data-type="photo">照片</button>
        <button class="tab" data-type="voice">语音</button>
        <button class="tab" data-type="link">链接</button>
      </div>

      <div class="tab-body" id="tab-text">
        <div class="note-wrap">
          <div class="note-tape"></div>
          <textarea id="add-text" class="note-paper" rows="5" placeholder="一句书摘、一个歌名、突然冒出的话…"></textarea>
        </div>
      </div>
      <div class="tab-body hidden" id="tab-photo">
        <label class="file-drop" for="add-file">
          <span id="photo-drop-hint">点这里选一张照片<br />票根、天空、随手拍都可以</span>
        </label>
        <input id="add-file" type="file" accept="image/*" hidden />
        <div class="preview-wrap hidden" id="photo-preview-wrap">
          <img id="photo-preview" alt="照片预览" />
          <button id="btn-photo-clear" class="mini-btn">换一张</button>
        </div>
      </div>
      <div class="tab-body hidden" id="tab-voice">
        <div class="voice-area">
          <button id="btn-record" class="record-btn">● 开始录音</button>
          <span id="record-timer" class="record-timer hidden">0:00</span>
          <audio id="voice-preview" class="hidden" controls></audio>
          <div class="field hidden" id="transcription-field">
            <label>转写的文字（可修改）</label>
            <textarea id="add-transcription" rows="3" placeholder="AI 转写中…"></textarea>
          </div>
        </div>
      </div>
      <div class="tab-body hidden" id="tab-link">
        <div class="field">
          <label>链接</label>
          <input id="add-link" type="url" placeholder="https://…" />
        </div>
        <div class="field hidden" id="link-meta-field">
          <label>标题</label>
          <input id="add-link-title" type="text" placeholder="自动抓取…" />
        </div>
        <div class="field hidden" id="link-desc-field">
          <label>简介</label>
          <textarea id="add-link-desc" rows="2" placeholder="自动抓取…"></textarea>
        </div>
      </div>

      <div class="field">
        <label>备注（可选）</label>
        <input id="add-note" type="text" placeholder="比如：那天下午的电影院" />
      </div>

      <div class="mood-section">
        <div class="mood-head">
          <span class="mood-label">氛围 <em>（选 1–3 个）</em></span>
          <button id="btn-ai" class="mini-btn" title="让 AI 帮你猜氛围">✨ 让 AI 猜</button>
        </div>
        <div id="add-mood-chips" class="chips"></div>
        <div id="ai-status" class="ai-status hidden"></div>
      </div>

      <div class="panel-foot">
        <button id="btn-save" class="primary-btn big">收进匣子</button>
      </div>
    </div>
  </div>

  <!-- 设置 -->
  <div id="settings-overlay" class="overlay hidden" role="dialog" aria-label="设置">
    <div class="panel settings-panel">
      <div class="panel-head">
        <h2>设置</h2>
        <button class="round-btn js-close" title="关闭">✕</button>
      </div>

      <div class="setting-group">
        <div class="setting-row">
          <span>点击音效</span>
          <label class="switch"><input id="set-sound" type="checkbox" /><span class="slider"></span></label>
        </div>
        <div class="setting-row">
          <span>幻灯片钢琴曲</span>
          <label class="switch"><input id="set-music" type="checkbox" /><span class="slider"></span></label>
        </div>
      </div>

      <div class="setting-group">
        <div class="setting-title">AI（可选）</div>
        <div class="field">
          <label>Worker 地址</label>
          <div class="row">
            <input id="set-worker-url" type="url" placeholder="https://xxx.workers.dev" />
            <button id="btn-test-worker" class="mini-btn">测试</button>
          </div>
          <p class="hint">不填也能用：氛围手动选、语音只存原声、链接只存网址。</p>
          <div id="worker-status" class="ai-status"></div>
        </div>
      </div>

      <div class="setting-group">
        <div class="setting-title">自定义氛围词</div>
        <div class="row">
          <input id="set-new-mood" type="text" placeholder="加一个氛围词，如：松弛" maxlength="6" />
          <button id="btn-add-mood" class="mini-btn">添加</button>
        </div>
        <div id="custom-mood-chips" class="chips"></div>
      </div>

      <div class="setting-group">
        <div class="setting-title">备份</div>
        <div class="row">
          <button id="btn-export" class="mini-btn">导出备份</button>
          <label for="import-file" class="mini-btn file-btn">导入备份</label>
          <input id="import-file" type="file" accept="application/json,.json" hidden />
          <button id="btn-clear" class="mini-btn danger">清空全部</button>
        </div>
        <p class="hint">备份是一个单文件 JSON，包含所有碎片和照片/语音，可下载到本地保存。</p>
      </div>
      <div id="settings-status" class="ai-status"></div>
    </div>
  </div>

  <!-- 编辑碎片 -->
  <div id="edit-overlay" class="overlay hidden" role="dialog" aria-label="编辑碎片">
    <div class="panel edit-panel">
      <div class="panel-head">
        <h2>编辑碎片</h2>
        <button class="round-btn js-close" title="关闭">✕</button>
      </div>
      <div id="edit-media" class="edit-media"></div>
      <div class="field" id="edit-text-field">
        <label>内容</label>
        <textarea id="edit-text" rows="3"></textarea>
      </div>
      <div class="field">
        <label>备注</label>
        <input id="edit-note" type="text" />
      </div>
      <div class="field hidden" id="edit-trans-field">
        <label>语音转写</label>
        <textarea id="edit-transcription" rows="2"></textarea>
      </div>
      <div class="mood-section">
        <div class="mood-head"><span class="mood-label">氛围</span></div>
        <div id="edit-mood-chips" class="chips"></div>
      </div>
      <div class="panel-foot split">
        <button id="btn-delete" class="mini-btn danger">删除</button>
        <button id="btn-edit-save" class="primary-btn">保存</button>
      </div>
    </div>
  </div>

  <!-- 确认框 -->
  <div id="confirm-overlay" class="overlay hidden" role="alertdialog">
    <div class="panel confirm-panel">
      <p id="confirm-text"></p>
      <div class="panel-foot split">
        <button id="btn-confirm-0" class="mini-btn">再想想</button>
        <button id="btn-confirm-1" class="primary-btn danger-btn">确定</button>
      </div>
    </div>
  </div>

  <!-- 自检 -->
  <div id="selftest-overlay" class="overlay hidden">
    <div class="panel selftest-panel">
      <div class="panel-head"><h2>自检</h2><button class="round-btn js-close" title="关闭">✕</button></div>
      <pre id="selftest-output" class="selftest-output"></pre>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
